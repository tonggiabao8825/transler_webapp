[project]
name = "transler"
version = "0.1.0"
description = "Transler PDF translation API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "boto3>=1.37,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pymupdf==1.25.2",
  "tenacity>=9,<10",
  "structlog>=25,<26",
  "alembic>=1.15,<2",
  "psutil>=7,<8",
  "lxml>=6,<7",
  "cryptography>=46,<49",
]

[project.optional-dependencies]
worker = [
    "pdf2zh==1.9.11",
    "onnxruntime>=1.20,<2",
    "numpy>=2,<3",
    "pdfminer-six==20250416",
    "tencentcloud-sdk-python-tmt==3.0.1394",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "lxml>=6,<7",
    "pdf2docx>=0.5.8,<1",
    "markdown-it-py>=4,<5",
    "beautifulsoup4>=4.14,<5",
    "weasyprint>=68,<70",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "boto3-stubs[s3]>=1.37,<2",
    "types-requests>=2.32",
    "celery-types>=0.23",
    "types-psutil>=7.2.2.20260906",
    "lxml-stubs>=0.5.1",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pdf2zh.*", "celery.*", "onnxruntime", "weasyprint", "pdf2docx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transler.pdf_layout"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Compose infrastructure", "translation: calls the real PDFMathTranslate engine and translation provider"]
